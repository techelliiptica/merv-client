# MERV Logger Configuration File
# Place this file in your resources folder (src/main/resources/mervlogger.properties)
# The configuration will be automatically loaded when MervLoggerFactory is first used.

# ============================================================================
# Global Log Level Configuration
# ============================================================================
# Set the global log level for all loggers.
# Valid values: TRACE, DEBUG, INFO, WARN, ERROR
# Default: INFO
# ============================================================================
merv.logger.level=INFO

# ============================================================================
# SLF4J Integration
# ============================================================================
# Whether to use SLF4J backend if available on the classpath.
# If true and SLF4J is available, logs will be routed through SLF4J.
# If false or SLF4J is not available, logs will be written to console.
# Valid values: true, false
# Default: true
# ============================================================================
merv.logger.use.slf4j=true

# ============================================================================
# Log Format Configuration (Optional)
# ============================================================================
# Custom log format pattern for console output (when SLF4J is not used).
# Available placeholders:
#   %d or %date  - Timestamp (formatted according to merv.logger.date.format)
#   %level       - Log level (TRACE, DEBUG, INFO, WARN, ERROR)
#   %logger      - Logger name (typically class name)
#   %msg or %message - Log message
#   %n           - New line
#
# Example patterns:
#   [%d] %level %logger - %msg
#   %date [%level] %logger: %message
# Default: [%d] %level %logger - %msg
# ============================================================================
# merv.logger.format.pattern=[%d] %level %logger - %msg

# ============================================================================
# Date Format Configuration (Optional)
# ============================================================================
# Date format pattern for timestamps in log messages.
# Uses Java SimpleDateFormat patterns.
# Examples:
#   yyyy-MM-dd HH:mm:ss.SSS  (default)
#   yyyy-MM-dd HH:mm:ss
#   dd/MM/yyyy HH:mm:ss
# Default: yyyy-MM-dd HH:mm:ss.SSS
# ============================================================================
# merv.logger.date.format=yyyy-MM-dd HH:mm:ss.SSS

# ============================================================================
# Example Configurations
# ============================================================================
# 
# For development (verbose logging):
# merv.logger.level=DEBUG
# 
# For production (minimal logging):
# merv.logger.level=WARN
# 
# To disable SLF4J and use console logging only:
# merv.logger.use.slf4j=false
# 
# Custom format with more details:
# merv.logger.format.pattern=[%d] [%level] [%logger] %msg%n
# merv.logger.date.format=yyyy-MM-dd HH:mm:ss.SSS
# ============================================================================

